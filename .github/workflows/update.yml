
name: Update iPhone Prices V4.2

on:
  schedule:
    - cron: '15 */3 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-price-tracker
  cancel-in-progress: false

jobs:
  update-prices:

    runs-on: ubuntu-latest

    timeout-minutes: 120

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify crawler V4.2
        run: |
          echo "=============================="
          echo "CHECKING CRAWLER VERSION"
          git rev-parse HEAD
          pwd
          ls -la crawler
          grep -n "VERSION" crawler/main.py

          if ! grep -Fq 'VERSION = "V4.2"' crawler/main.py; then
            echo "ERROR: MAIN.PY IS NOT V4.2"
            exit 1
          fi

          echo "MAIN.PY V4.2 VERIFIED"
          echo "=============================="

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Check Python syntax
        run: |
          python -m py_compile crawler/main.py
          python -m py_compile crawler/price_reader.py
          python -m py_compile crawler/discover.py
          python -m py_compile crawler/export_dashboard.py

      - name: Discover iPhone products
        run: |
          python crawler/discover.py

      - name: Update iPhone prices V4.2
        run: |
          python -u crawler/main.py

      - name: Export dashboard data
        run: |
          python crawler/export_dashboard.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Auto update iPhone prices V4.2"
            git push origin main
          fi
