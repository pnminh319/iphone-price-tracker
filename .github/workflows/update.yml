
name: Update iPhone Prices V3

on:
  workflow_dispatch:

  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iphone-price-update
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Discover iPhone products
        run: python crawler/discover.py

      - name: Update iPhone prices
        continue-on-error: true
        run: python crawler/main.py

      - name: Export Dashboard data
        run: python crawler/export_dashboard.py

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: crawl
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Dashboard
        id: deployment
        uses: actions/deploy-pages@v4
