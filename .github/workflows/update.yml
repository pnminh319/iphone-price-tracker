name: Update iPhone Prices V5.4.2.4

on:
  schedule:
    - cron: '15 */3 * * *'

  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iphone-price-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate Python
        run: |
          python -m compileall -q crawler

      - name: Validate specs
        run: |
          python -m json.tool docs/specs.json > /dev/null

      - name: Validate JavaScript
        run: |
          node --check docs/value.js
          node --check docs/history.js

      - name: Check dashboard
        run: |
          test -f docs/index.html

  update-prices:

    needs: validate

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    timeout-minutes: 120

    permissions:
      contents: write

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      ENABLE_BACKFILL: ${{ vars.ENABLE_BACKFILL }}
      TZ: Asia/Ho_Chi_Minh
      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Discover cloud products
        continue-on-error: true
        run: |
          python crawler/cloud_runner.py discover

      - name: Update cloud prices
        continue-on-error: true
        run: |
          python -u crawler/cloud_runner.py prices

      - name: Export all retailer data
        run: |
          python crawler/export_dashboard.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Auto update iPhone prices V5.4.2.4"
            git push origin main
          fi

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:

    needs: update-prices

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
