
name: Test Product Prices V5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          pip install requests beautifulsoup4

      - name: Inspect product prices
        run: |
          python -u - <<'PY'
          import requests
          import re
          import json
          import time

          from bs4 import BeautifulSoup
          from urllib.parse import urlparse
          from urllib.robotparser import RobotFileParser

          AGENT = "iPhonePriceTracker/1.0"

          PRODUCTS = {
              "CPS": "https://cellphones.com.vn/iphone-17-256gb.html",

              "HHM": "https://hoanghamobile.com/dien-thoai-di-dong/apple-iphone-15-128gb-chinh-hang-vn-a",

              "DDV": "https://didongviet.vn/dien-thoai/iphone-17-256gb.html",

              "VTS": "https://viettelstore.vn/dien-thoai/iphone-17-256gb-pid355077.html"
          }

          session = requests.Session()

          session.headers.update({
              "User-Agent": AGENT,
              "Accept-Language": "vi-VN,vi;q=0.9"
          })

          PRICE_PATTERN = re.compile(
              r"\d{1,3}(?:[.,]\d{3}){2}\s*(?:đ|₫|VND|VNĐ)?",
              re.IGNORECASE
          )

          def allowed(url):

              p = urlparse(url)

              robots_url = (
                  f"{p.scheme}://{p.netloc}/robots.txt"
              )

              response = session.get(
                  robots_url,
                  timeout=(15, 30),
                  allow_redirects=False
              )

              print("ROBOTS_HTTP:", response.status_code)

              if response.status_code in (404, 410):
                  return True

              if response.status_code != 200:
                  return False

              parser = RobotFileParser()

              parser.parse(
                  response.text.splitlines()
              )

              return parser.can_fetch(AGENT, url)

          def walk_json(data):

              if isinstance(data, dict):

                  keys = [
                      "price",
                      "lowPrice",
                      "highPrice",
                      "priceCurrency",
                      "availability",
                      "originalPrice",
                      "salePrice",
                      "regularPrice"
                  ]

                  found = {
                      k: data[k]
                      for k in keys
                      if k in data
                  }

                  if found:
                      print(
                          "JSON_PRICE:",
                          json.dumps(
                              found,
                              ensure_ascii=False
                          )[:1000]
                      )

                  for value in data.values():
                      walk_json(value)

              elif isinstance(data, list):

                  for item in data:
                      walk_json(item)

          def inspect(code, url):

              print("=" * 70)
              print("RETAILER:", code)
              print("URL:", url)

              try:

                  if not allowed(url):

                      print("STATUS: ROBOTS_UNAVAILABLE")
                      return

                  response = session.get(
                      url,
                      timeout=(15, 40),
                      allow_redirects=False
                  )

                  print("HTTP:", response.status_code)

                  if response.status_code != 200:
                      return

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser"
                  )

                  print(
                      "TITLE:",
                      soup.title.get_text(strip=True)
                      if soup.title else ""
                  )

                  print("HTML_SIZE:", len(response.content))

                  print("--- JSON LD ---")

                  for script in soup.select(
                      'script[type="application/ld+json"]'
                  ):

                      try:

                          data = json.loads(
                              script.get_text()
                          )

                          walk_json(data)

                      except Exception:
                          pass

                  print("--- META PRICE ---")

                  for tag in soup.find_all("meta"):

                      key = str(
                          tag.get("property")
                          or tag.get("name")
                          or tag.get("itemprop")
                          or ""
                      )

                      if "price" in key.lower():

                          print(
                              key,
                              "=",
                              tag.get("content")
                          )

                  print("--- STRIKETHROUGH PRICES ---")

                  old_count = 0

                  for tag in soup.select("del, s, strike"):

                      text = tag.get_text(
                          " ",
                          strip=True
                      )

                      if PRICE_PATTERN.search(text):

                          print(
                              "OLD_PRICE:",
                              str(tag)[:500]
                          )

                          old_count += 1

                          if old_count >= 20:
                              break

                  print("--- PRICE HTML CANDIDATES ---")

                  seen = set()
                  count = 0

                  for tag in soup.find_all([
                      "span",
                      "div",
                      "p",
                      "strong",
                      "b",
                      "del",
                      "s",
                      "strike",
                      "ins"
                  ]):

                      text = tag.get_text(
                          " ",
                          strip=True
                      )

                      if not text or len(text) > 100:
                          continue

                      if not PRICE_PATTERN.search(text):
                          continue

                      if any(
                          PRICE_PATTERN.search(
                              child.get_text(" ", strip=True)
                          )
                          for child in tag.find_all(
                              recursive=False
                          )
                      ):
                          continue

                      classes = " ".join(
                          tag.get("class", [])
                      )

                      parent = tag.parent

                      parent_classes = (
                          " ".join(
                              parent.get("class", [])
                          )
                          if parent else ""
                      )

                      key = (
                          text,
                          classes,
                          parent_classes
                      )

                      if key in seen:
                          continue

                      seen.add(key)

                      print(
                          "PRICE_TEXT:", text,
                          "| TAG:", tag.name,
                          "| CLASS:", classes,
                          "| PARENT:", parent_classes
                      )

                      print(
                          "HTML:",
                          str(tag)[:500]
                      )

                      count += 1

                      if count >= 50:
                          break

                  print("PRICE_NODES_FOUND:", count)
                  print("OLD_PRICE_NODES_FOUND:", old_count)

                  print("STATUS: INSPECTED")

              except Exception as e:

                  print("ERROR:", str(e))

          for code, url in PRODUCTS.items():

              inspect(code, url)

              time.sleep(3)

          print("=" * 70)
          print("PRODUCT PRICE TEST V5 COMPLETE")
          PY
